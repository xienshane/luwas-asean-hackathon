# LUWAS country pack — Da Nang, Vietnam
#
# STATUS: PARTIAL — loaded and running, three of six surfaces genuinely done.
# Surfaces 1 (boundaries + population), 5 (language) and 6 (gazetteer) ship. A
# Vietnamese report parses, geocodes, scores and dispatches over a real road
# graph. Surfaces 2, 3 and 4 are NOT done and are marked so below.
#
# Values are filled only where a real source is known. Every `null` carries a
# `needs:` note saying exactly what would fill it — honest holes are a usable
# plan; invented values are a liability.
#
# Surfaces and their PH counterparts: docs/COUNTRY_PACKS.md

pack:
  id: vn-danang
  country: VN
  region: Da Nang
  status: partial
  based_on: ph-cebu          # the shipping pilot pack this was derived from

# --- 1. Admin boundaries + population ------------------------------- LOADED -
admin:
  unit: ward                 # phường (urban) / xã (rural) — the barangay analogue
  # Post-July-2025 reform: the district tier was abolished and ~2/3 of all wards
  # and communes were dissolved, so OSM retagged the survivors 8 -> 6. These are
  # the CURRENT boundaries; a pre-reform gazetteer names places that no longer
  # exist.
  boundary_source: >
    OpenStreetMap relation 1891418 (Thành phố Đà Nẵng), admin_level=6,
    extracted to data-pipeline/raw/osm-boundaries/danang_wards.gpkg.
  boundary_scope: >
    11 urban-core wards. Chosen because every one has its centroid inside the
    road extract, so every one is routable — an area you cannot route to is
    worse than an absent one. Hải Vân and the Quảng Nam rural communes are out.
  population_source: >
    Each ward's own OSM `population` tag (source:population=gis.vn,
    population:date=2025-07-01 — the date the merger took effect).
    1,178,687 across the 11. Read from the extract, never hand-entered; an
    untagged ward fails the load rather than being estimated.
  loader: data-pipeline/ingest_danang.py
  code_scheme: null
  code_needs: >
    The VN administrative code equivalent of PSGC, to key units stably across
    releases. Names are the join key today, which is fragile across reforms —
    and Vietnam has just demonstrated how often those happen.

# --- 2. Storm scale ---------------------------------------------------------
storm_scale:
  # LUWAS needs ONE ordinal 0-5. PH uses PAGASA categories
  # (data-pipeline/build_training_table.py CATEGORY_ORDER).
  authority: Viet Nam national storm / natural-disaster risk-level framework
  ordinal_map: null
  ordinal_needs: >
    The VN level -> 0..5 ordinal lookup, plus the matching sustained-wind
    thresholds for the live path. Both must change together:
    build_training_table.py CATEGORY_ORDER and web/lib/live/conditions.ts.
  live_feed: open-meteo      # source-agnostic; already used for the PH pilot
  # DONE. Sample points live on the region itself (web/lib/regions.ts), north /
  # centre / south across the loaded urban core: Liên Chiểu, Hải Châu,
  # Ngũ Hành Sơn. The wind read is worst-case across them, as in Cebu.
  sample_points: web/lib/regions.ts REGIONS.danang.samplePoints
  # STILL MISSING: the ordinal_map above. Da Nang wind is therefore read through
  # the PAGASA ladder. Honest for a demo (both map wind -> an ordinal), wrong for
  # a deployment, and the category LABEL on screen is Philippine.

# --- 3. Hazard rasters ---------------------------------------- PROXY, NOT REAL
hazard:
  authority: VNDMA (Viet Nam Disaster and Dyke Management Authority)
  layers: null
  # What is loaded instead is a GEOGRAPHIC PROXY computed from real OSM geometry:
  #   flood_100yr      = ward area fraction within 500 m of mapped inland water
  #   storm_surge_ssa2 = ward area fraction within 1,500 m of mapped coastline
  # Real distances over real polygons, and they rank wards the way local
  # knowledge would — but not a hydrological model, not a return period, and not
  # something a responder should plan against. Never let a shaded map imply VNDMA.
  proxy_builder: data-pipeline/build_danang_hazard.py
  proxy_status: stage_dressing_with_a_defensible_shape
  layers_needs: >
    Per-hazard polygon/raster layers (flood by return period, landslide, storm
    surge) with the per-polygon intensity attribute named, in the shape of
    NOAH_LAYERS in data-pipeline/ingest_static.py. Raw geometry stays local;
    only per-ward exposure is persisted.

# --- 4. Impact history (the TabPFN context) --------------------------------
impact_history:
  # TabPFN v2 is in-context: this CSV IS the context. Swapping countries swaps
  # a CSV — there is no training job. See docs/COUNTRY_PACKS.md surface 4.
  table_path: null
  table_needs: >
    A CSV with the canonical FEATURE_COLUMNS (ai-services/app/services/impact_model.py)
    plus targets `affected` and `damage_rate`, one row per (storm, ward-or-province).
    Candidate sources: VN national disaster damage reporting, provincial
    post-storm assessments. NOT sourced.
  # IN USE TODAY: the PHILIPPINE table. Vietnamese wards are predicted by reading
  # 1,261 Philippine rows in context at predict time. That is not a workaround —
  # it is what made "no training job" true — but it is also exactly why the
  # accuracy numbers below are unmeasured. Say both halves or neither.
  table_in_use: ai-services/data/training_table.csv   # Philippine
  retraining_required: false
  accuracy_status: not_measured
  accuracy_needs: >
    Run ai-services/scripts/evaluate_impact.py (LOTO, country-agnostic) against
    the VN table. Do NOT reuse the Philippine accuracy figures.

# --- 5. Language / lexicon --------------------------------------------------
language:
  primary: vi
  parser_model: aisingapore/Gemma-SEA-LION-v4-27B-IT   # post-trained on Vietnamese
  status: ships                                        # not future work
  acceptance_test: ai-services/tests/test_parse_presets.py::test_vietnamese_preset_extracts_and_translates
  lexicon: null
  lexicon_needs: >
    Optional. Local terms for flooded / cut off / evacuation centre, to raise
    extraction confidence. Parsing works without it.

# --- 6. Intake channel + gazetteer -----------------------------------------
intake:
  channels:
    - id: sms
      status: adapter_needed
      needs: >
        A local SMS aggregator webhook adapter. The inbound payload is
        normalised in web/lib/sms/normalize.ts, so the parse-and-store path
        downstream is already channel-agnostic.
    - id: zalo
      status: noted_not_built
      needs: >
        Zalo is the messaging channel with real reach in Vietnam. Same adapter
        shape as SMS; no work has been done on it.
  # DONE — it fell out of surface 1, as predicted. findBarangayByName
  # (web/lib/sms/barangay.ts) resolves against whatever admin table is loaded,
  # scoped by region.
  gazetteer: public.barangays where region = 'danang'
  gazetteer_note: >
    One seam had to be closed: SEA-LION returns the location romanized ("An Hai
    Ward, Da Nang"), which matched nothing against the stored "Phường An Hải".
    Both sides are now diacritic-folded before matching
    (supabase/migrations/20260810002000_barangay_name_normalized.sql). An
    unresolved name still lands flagged for coordinator review, never guessed.

# --- Deterministic core: country-independent -------------------------------
# Sphere supply standards (15 L water/person/day, 2,100 kcal/person/day) and the
# OR-Tools routing over the pgRouting distance matrix carry over unchanged. They
# are not country pack surfaces.
